<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>텔레그램 메시지 전송</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 0 20px; }
  textarea { width: 100%; height: 150px; font-size: 16px; padding: 10px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
  #result { margin-top: 10px; }
</style>
</head>
<body>
  <h2>DB * 그룹으로 메시지 보내기</h2>
  <textarea id="msg" placeholder="여기에 메시지를 입력하세요 (줄바꿈 가능)"></textarea><br>
  <button onclick="sendMsg()">전송</button>
  <div id="result"></div>

<script>
async function sendMsg() {
  const text = document.getElementById('msg').value;
  const result = document.getElementById('result');
  if (!text.trim()) { result.textContent = "메시지를 입력하세요"; return; }
  result.textContent = "전송 중...";
  try {
    const res = await fetch('/.netlify/functions/send-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (res.ok) {
      result.textContent = "전송 완료!";
      document.getElementById('msg').value = "";
    } else {
      result.textContent = "전송 실패";
    }
  } catch (e) {
    result.textContent = "오류: " + e;
  }
}
</script>
</body>
</html>
